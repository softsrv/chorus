# Air live-reload configuration
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/app"
  bin = "./tmp/main"
  full_bin = "./tmp/main"
  include_ext = ["go", "sql"]
  # Web assets are served from disk in development, so edits to them need no rebuild.
  exclude_dir = ["tmp", "vendor", "web"]
  delay = 1000

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
