name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chorus
          POSTGRES_PASSWORD: chorus
          POSTGRES_DB: chorus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U chorus"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://chorus:chorus@localhost:5432/chorus_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify sqlc output is up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate -f db/sqlc.yaml
          git diff --exit-code internal/db
      - name: Migrate
        run: go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@latest -path db/migrations -database "$TEST_DATABASE_URL" up
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./... && go vet -tags integration ./...
      - run: go test -race ./...
      - run: go test -race -tags integration -p 1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Builds the image on every run so Dockerfile breakage shows up in PRs, and
  # pushes it to Docker Hub only for commits to main that passed the tests.
  docker:
    needs: test
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            trriplejay/chorus:latest
            trriplejay/chorus:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
