name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chorus
          POSTGRES_PASSWORD: chorus
          POSTGRES_DB: chorus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U chorus"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://chorus:chorus@localhost:5432/chorus_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify sqlc output is up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate -f db/sqlc.yaml
          git diff --exit-code internal/db
      - name: Migrate
        run: go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@latest -path db/migrations -database "$TEST_DATABASE_URL" up
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./... && go vet -tags integration ./...
      - run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/jstest/quests.test.mjs web/jstest/rewards.test.mjs
      - run: go test -race -tags integration -p 1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Pull requests build the image without pushing so Dockerfile breakage shows up
  # before merge; passing pushes to main build and push the two tags to Docker Hub.
  docker-build-push:
    name: Docker image (build and push)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    permissions:
      contents: read
    uses: ./.github/workflows/docker-image.yml
    with:
      push: true
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  docker-build-only:
    name: Docker image (build only, no push)
    if: github.event_name == 'pull_request'
    needs: ci
    permissions:
      contents: read
    uses: ./.github/workflows/docker-image.yml
    with:
      push: false
