name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chorus
          POSTGRES_PASSWORD: chorus
          POSTGRES_DB: chorus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U chorus"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://chorus:chorus@localhost:5432/chorus_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make mod-verify
      - name: Secret scan
        run: make secret-scan
      - name: Verify sqlc output is up to date
        run: make sqlc-check
      - name: Migrate
        run: go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1 -path db/migrations -database "$TEST_DATABASE_URL" up
      - name: Migrate round-trip
        run: |
          go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1 -path db/migrations -database "$TEST_DATABASE_URL" down -all
          go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1 -path db/migrations -database "$TEST_DATABASE_URL" up
      - run: make fmt-check
      - run: go vet ./... && go vet -tags integration ./... && go vet -tags systest ./...
      - name: Check part boundaries
        run: go test -run 'TestImportBoundaries|TestWebClientImportsStayInWeb' ./internal/archtest/
      - run: go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make test-js
      - run: go test -race -tags integration -timeout 20m -p 1 ./...
      # The binary-mode system test asserts the generated stylesheet loads, so
      # build it first with the same pinned, checksummed Tailwind CLI the
      # Dockerfile uses.
      - name: Build web stylesheet
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tailwindcss" https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.0/tailwindcss-linux-x64
          echo "73f0e5459054e5cfaa8ab6f3b940f3fbe0f13cc7fd83bc24e7c655033c203400  $RUNNER_TEMP/tailwindcss" | sha256sum -c
          chmod +x "$RUNNER_TEMP/tailwindcss"
          PATH="$RUNNER_TEMP:$PATH" make tailwind
      - run: go test -race -tags systest -p 1 ./systest/...
      - run: make vulncheck

  # Both image jobs call docker-image.yml, which builds the image (load, no push)
  # and runs the system tests against it (SYSTEST_IMAGE) on every run.
  # docker-build-only runs that on every pull request; docker-build-push runs it on
  # pushes to main and pushes the two tags only after those tests pass.
  docker-build-push:
    name: Docker image (build and push)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    permissions:
      contents: read
    uses: ./.github/workflows/docker-image.yml
    with:
      push: true
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  docker-build-only:
    name: Docker image (build only, no push)
    if: github.event_name == 'pull_request'
    needs: ci
    permissions:
      contents: read
    uses: ./.github/workflows/docker-image.yml
    with:
      push: false
