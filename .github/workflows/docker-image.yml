name: Docker image

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        required: true
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chorus
          POSTGRES_PASSWORD: chorus
          POSTGRES_DB: chorus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U chorus"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://chorus:chorus@localhost:5432/chorus_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.20.1 -path db/migrations -database "$TEST_DATABASE_URL" up
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            trriplejay/chorus:latest
            trriplejay/chorus:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: System tests (Docker image)
        env:
          SYSTEST_IMAGE: trriplejay/chorus:sha-${{ github.sha }}
        run: go test -tags systest -p 1 ./systest/...
      - name: Push Docker image
        if: inputs.push
        # sha-<commit> first, latest last: a failed second push never leaves
        # latest pointing at an image whose sha tag was not pushed.
        run: |
          docker push trriplejay/chorus:sha-${{ github.sha }}
          docker push trriplejay/chorus:latest
